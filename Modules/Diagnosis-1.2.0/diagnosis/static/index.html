<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INSIGHT - Diagnosis</title>
  <style>
    :root {
      --primary: #0A9E8F;
      --primary-hover: #088A7D;
      --primary-light: #E6F6F5;
      --on-primary: #FFFFFF;
      --ink: #111827;
      --ink-muted: #6B7280;
      --ink-subtle: #9CA3AF;
      --canvas: #FFFFFF;
      --surface-1: #F9FAFB;
      --surface-2: #F3F4F6;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --urgent: #DC2626;
      --urgent-bg: #FEF2F2;
      --warning: #D97706;
      --warning-bg: #FFFBEB;
      --normal: #059669;
      --normal-bg: #ECFDF5;
      --info: #0284C7;
      --info-bg: #F0F9FF;
      --follow-up: #7C3AED;
      --follow-up-bg: #F5F3FF;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 15px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .diagnosis-module { padding: 24px 40px 48px; }
    .dm-topbar {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .dm-topbar h1 { margin: 0; font-size: 20px; }
    .dm-topbar .subtle { color: var(--ink-muted); font-size: 13px; }
    .dm-topbar .session { margin-left: auto; color: var(--ink-subtle); font-size: 12px; font-weight: 600; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 24px;
      align-items: start;
    }
    .card, .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--canvas);
      box-shadow: var(--shadow-card);
    }
    .card { padding: 24px 28px; }
    .panel { margin-bottom: 16px; padding: 20px 22px; background: var(--surface-1); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .card-head h2 { margin: 0; font-size: 18px; }
    .panel h2 {
      margin: 0 0 12px;
      color: var(--ink-muted);
      font-size: 13px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .badge {
      flex: none;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface-1);
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.met { border-color: var(--normal); background: var(--normal-bg); color: var(--normal); }
    .badge.unmet { border-color: var(--urgent); background: var(--urgent-bg); color: var(--urgent); }
    .disclaimer {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid var(--info);
      border-radius: var(--radius-md);
      background: var(--info-bg);
      color: var(--ink);
      font-size: 13px;
    }
    .context-state { margin: 0 0 16px; color: var(--ink-muted); font-size: 13px; }
    .error-state {
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid var(--urgent);
      border-left-width: 4px;
      border-radius: var(--radius-md);
      background: var(--urgent-bg);
      color: var(--ink);
      font-size: 13px;
    }
    .group { margin-top: 20px; }
    .group h3 {
      margin: 0 0 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    .crit {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--surface-2);
    }
    .crit input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--primary); }
    .crit label { cursor: pointer; }
    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--info-bg);
      color: var(--info);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tag.core { background: var(--primary-light); color: var(--primary-hover); }
    .tag.guard { background: var(--follow-up-bg); color: var(--follow-up); }
    .tag.duration { background: var(--warning-bg); color: var(--warning); }
    .conclusion { position: sticky; top: 24px; }
    .metric { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }
    .metric .value { font-family: "JetBrains Mono", Menlo, monospace; font-weight: 700; }
    .metric .ok { color: var(--normal); }
    .metric .bad { color: var(--urgent); }
    .reason { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--ink-muted); }
    .failures { margin: 8px 0 0; padding-left: 20px; color: var(--urgent); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .btn {
      min-height: 40px;
      padding: 10px 20px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-warning { border-color: var(--warning); background: var(--canvas); color: var(--warning); }
    .btn-warning:hover { background: var(--warning-bg); }
    .btn:disabled { border-color: var(--border-strong); background: var(--surface-2); color: var(--ink-subtle); cursor: not-allowed; }
    .btn:focus-visible, .crit input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .save-state { min-height: 24px; padding-top: 8px; color: var(--ink-subtle); font-size: 12px; }
    .save-state.saving { color: var(--info); }
    .save-state.saved { color: var(--normal); }
    .save-state.error { color: var(--urgent); }
    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .diagnosis-module { padding: 16px; }
      .workspace { grid-template-columns: 1fr; }
      .conclusion { position: static; }
    }
    @media (max-width: 600px) {
      .btn { width: 100%; min-height: 44px; }
      .card { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="diagnosis-root"></div>
  <script>
    "use strict";

    function createDiagnosisModule(opts) {
      const root = (opts && opts.root) || document.body;
      const apiBaseUrl = (opts && typeof opts.apiBaseUrl === "string")
        ? opts.apiBaseUrl.replace(/\/+$/, "")
        : "";
      const embedded = !!(opts && opts.embedded);
      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
      const UID = "dm" + Math.random().toString(36).slice(2, 8) + "-";
      const listeners = [];
      let context = normalizeContext(opts);
      let criteria = [];
      let assessment = null;
      let etag = "";
      let csrfToken = "";
      let createKey = makeIdempotencyKey();
      let saveTimer = null;
      let controller = new AbortController();
      let mounted = false;
      let destroyed = false;

      function normalizeContext(value) {
        return {
          patientId: String((value && value.patientId) || ""),
          encounterId: String((value && value.encounterId) || "")
        };
      }

      function makeIdempotencyKey() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) {
          return "diagnosis-ui-" + crypto.randomUUID();
        }
        return "diagnosis-ui-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[character]));
      }

      function buildDom() {
        root.innerHTML = "";
        const wrapper = document.createElement("div");
        wrapper.className = "diagnosis-module";
        if (!embedded) {
          const header = document.createElement("header");
          header.className = "dm-topbar";
          header.innerHTML = '<h1>INSIGHT</h1><span class="subtle">Diagnosis · DSM-5-TR Schizophrenia</span><span class="session">Encounter assessment</span>';
          wrapper.appendChild(header);
        }
        const workspace = document.createElement("section");
        workspace.className = "workspace";
        workspace.innerHTML =
          '<div class="card">' +
            '<div class="card-head"><h2 id="' + UID + 'workspace-heading" tabindex="-1">DSM-5-TR criteria for schizophrenia</h2>' +
              '<span class="badge" id="' + UID + 'status-badge">Loading</span></div>' +
            '<div class="disclaimer"><strong>Decision-support.</strong><span>Psychiatrist final review required. Server evaluation is supporting evidence and never records a diagnosis without an explicit clinician action.</span></div>' +
            '<p class="context-state" id="' + UID + 'context-state">Waiting for host-provided Patient and Encounter context.</p>' +
            '<div class="error-state hidden" id="' + UID + 'error-state" role="alert" tabindex="-1"></div>' +
            '<div id="' + UID + 'criteria-root"></div>' +
            '<div class="actions"><button class="btn btn-primary" id="' + UID + 'confirm-btn" disabled>Confirm diagnosis</button>' +
              '<button class="btn btn-warning" id="' + UID + 'bypass-btn" disabled>Record clinician bypass</button></div>' +
            '<div class="save-state" id="' + UID + 'save-state" role="status" aria-live="polite"></div>' +
          '</div>' +
          '<aside class="conclusion">' +
            '<div class="panel"><h2>Server evaluation</h2>' +
              '<div class="metric"><span>Characteristic symptoms</span><span class="value" id="' + UID + 'm-symptoms">0</span></div>' +
              '<div class="metric"><span>Core triad symptoms</span><span class="value" id="' + UID + 'm-core">0</span></div>' +
              '<div class="metric"><span>Criteria result</span><span class="value" id="' + UID + 'm-result">Pending</span></div>' +
              '<div class="reason" id="' + UID + 'reason">No server evaluation loaded.</div>' +
              '<ul class="failures hidden" id="' + UID + 'failures"></ul></div>' +
            '<div class="panel"><h2>Clinician decision</h2>' +
              '<div class="metric"><span>State</span><span class="value" id="' + UID + 'decision-state">None recorded</span></div>' +
              '<div class="metric"><span>Last update</span><span class="value" id="' + UID + 'updated">—</span></div>' +
              '<p class="reason" id="' + UID + 'decision-note">No clinician decision has been recorded.</p></div>' +
          '</aside>';
        wrapper.appendChild(workspace);
        root.appendChild(wrapper);
      }

      const $ = suffix => root.querySelector("#" + UID + suffix);

      function addListener(node, type, handler) {
        node.addEventListener(type, handler);
        listeners.push({node, type, handler});
      }

      function readCsrfToken() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) csrfToken = meta.getAttribute("content") || "";
      }

      async function ensureCsrfToken() {
        readCsrfToken();
        if (csrfToken) return;
        const response = await fetch(apiBaseUrl + "/diagnosis/_csrf", {
          credentials: "same-origin",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("Unable to establish write protection.");
        const body = await response.json();
        csrfToken = body.token || "";
        if (!csrfToken) throw new Error("Unable to establish write protection.");
      }

      async function loadMeta() {
        const response = await fetch(apiBaseUrl + "/diagnosis/_meta", {
          credentials: "same-origin",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("Diagnosis criteria could not be loaded.");
        const body = await response.json();
        criteria = Array.isArray(body.criteria) ? body.criteria : [];
        renderCriteria();
      }

      function renderCriteria() {
        const groups = {};
        criteria.forEach(item => { (groups[item.group] = groups[item.group] || []).push(item); });
        const criteriaRoot = $("criteria-root");
        criteriaRoot.innerHTML = "";
        Object.entries(groups).forEach(([name, items]) => {
          const group = document.createElement("fieldset");
          group.className = "group";
          group.innerHTML = "<legend><h3>" + escapeHtml(name) + "</h3></legend>";
          items.forEach(item => {
            const tag = item.core ? '<span class="tag core">core</span>'
              : item.duration ? '<span class="tag duration">duration</span>'
              : item.guard ? '<span class="tag guard">exclusion</span>' : "";
            const row = document.createElement("div");
            row.className = "crit";
            row.innerHTML = '<input type="checkbox" id="' + UID + "criterion-" + item.id + '" data-id="' + item.id + '" disabled />' +
              '<label for="' + UID + "criterion-" + item.id + '">' + escapeHtml(item.text) + tag + "</label>";
            group.appendChild(row);
          });
          criteriaRoot.appendChild(group);
        });
        criteriaRoot.querySelectorAll('input[type="checkbox"]').forEach(checkbox => addListener(checkbox, "change", onChange));
      }

      function checkedIds() {
        const criteriaRoot = $("criteria-root");
        if (!criteriaRoot) return [];
        return Array.from(criteriaRoot.querySelectorAll('input[type="checkbox"]:checked')).map(input => input.dataset.id);
      }

      function setBusy(busy) {
        const criteriaRoot = $("criteria-root");
        if (criteriaRoot) {
          criteriaRoot.querySelectorAll('input[type="checkbox"]').forEach(input => { input.disabled = busy || !assessment; });
        }
        const bypass = $("bypass-btn");
        if (bypass) bypass.disabled = busy || !assessment;
        const confirmButton = $("confirm-btn");
        if (confirmButton) confirmButton.disabled = busy || !assessment || !assessment.evaluation.met;
      }

      function clearError() {
        const error = $("error-state");
        if (error) {
          error.textContent = "";
          error.classList.add("hidden");
        }
      }

      function showError(message) {
        const error = $("error-state");
        if (error) {
          error.textContent = message;
          error.classList.remove("hidden");
          error.focus();
        }
        const saveState = $("save-state");
        if (saveState) {
          saveState.textContent = "Not saved";
          saveState.className = "save-state error";
        }
      }

      async function responseError(response, fallback) {
        try {
          const problem = await response.json();
          return problem.title || problem.detail || fallback;
        } catch (_) {
          return fallback;
        }
      }

      function validateAssessment(value) {
        if (!value || value.schemaVersion !== "2.0.0" || !value.assessmentId ||
            value.patientId !== context.patientId || value.encounterId !== context.encounterId ||
            !Array.isArray(value.checkedCriteria) || !value.evaluation ||
            typeof value.evaluation.met !== "boolean") {
          throw new Error("The Diagnosis server returned an incompatible assessment.");
        }
      }

      function renderServer(value) {
        assessment = value;
        const evaluation = value.evaluation;
        const criteriaRoot = $("criteria-root");
        if (criteriaRoot) {
          criteriaRoot.querySelectorAll('input[type="checkbox"]').forEach(input => {
            input.checked = value.checkedCriteria.includes(input.dataset.id);
          });
        }
        $("m-symptoms").textContent = String(evaluation.aCount);
        $("m-core").textContent = String(evaluation.coreCount);
        const result = $("m-result");
        result.textContent = evaluation.met ? "Met" : "Not met";
        result.className = "value " + (evaluation.met ? "ok" : "bad");
        $("reason").textContent = evaluation.reason;
        const failures = $("failures");
        failures.innerHTML = (evaluation.failures || []).map(failure => "<li>" + escapeHtml(failure) + "</li>").join("");
        failures.classList.toggle("hidden", !evaluation.failures || evaluation.failures.length === 0);
        const badge = $("status-badge");
        badge.textContent = evaluation.met ? "Server: criteria met" : "Server: criteria not met";
        badge.className = "badge " + (evaluation.met ? "met" : "unmet");
        $("decision-state").textContent = value.clinicianDecision ? value.clinicianDecision.type : "None recorded";
        $("decision-note").textContent = value.clinicianDecision
          ? "Recorded by the authenticated psychiatrist."
          : "No clinician decision has been recorded.";
        $("updated").textContent = value.updatedAt ? new Date(value.updatedAt).toLocaleTimeString() : "—";
        setBusy(false);
      }

      async function loadAssessment() {
        if (!UUID_RE.test(context.patientId) || !UUID_RE.test(context.encounterId)) {
          throw new Error("Diagnosis requires host-provided canonical Patient and Encounter UUIDs.");
        }
        const latestUrl = apiBaseUrl + "/api/diagnosis/v2/encounters/" +
          encodeURIComponent(context.encounterId) + "/assessments/latest";
        let response = await fetch(latestUrl, {credentials: "same-origin", signal: controller.signal});
        if (response.status === 404) {
          response = await fetch(apiBaseUrl + "/api/diagnosis/v2/assessments", {
            method: "POST",
            credentials: "same-origin",
            signal: controller.signal,
            headers: {
              "Content-Type": "application/json",
              "X-Schema-Version": "2.0.0",
              "Idempotency-Key": createKey,
              "X-CSRF-Token": csrfToken
            },
            body: JSON.stringify(context)
          });
        }
        if (!response.ok) {
          throw new Error(await responseError(response, "Diagnosis assessment could not be loaded or initialized."));
        }
        const value = await response.json();
        validateAssessment(value);
        etag = response.headers.get("ETag") || "";
        if (!etag) throw new Error("The Diagnosis server did not provide a concurrency version.");
        renderServer(value);
        clearError();
        $("context-state").textContent = "Encounter-bound assessment loaded from Diagnosis v2.";
        $("workspace-heading").focus();
      }

      async function persistAssessment(decisionType) {
        saveTimer = null;
        if (destroyed || !assessment) return;
        setBusy(true);
        clearError();
        const saveState = $("save-state");
        saveState.textContent = "Saving...";
        saveState.className = "save-state saving";
        try {
          const response = await fetch(apiBaseUrl + "/api/diagnosis/v2/assessments/" + encodeURIComponent(assessment.assessmentId), {
            method: "PUT",
            credentials: "same-origin",
            signal: controller.signal,
            headers: {
              "Content-Type": "application/json",
              "X-Schema-Version": "2.0.0",
              "X-CSRF-Token": csrfToken,
              "If-Match": etag
            },
            body: JSON.stringify({
              checkedCriteria: checkedIds(),
              clinicianDecision: decisionType ? {type: decisionType} : null
            })
          });
          if (!response.ok) throw new Error(await responseError(response, "Diagnosis changes were not saved."));
          const value = await response.json();
          validateAssessment(value);
          const nextEtag = response.headers.get("ETag") || "";
          if (!nextEtag) throw new Error("The Diagnosis server did not provide a concurrency version.");
          etag = nextEtag;
          renderServer(value);
          saveState.textContent = "Saved";
          saveState.className = "save-state saved";
        } catch (error) {
          if (error.name === "AbortError" || destroyed) return;
          renderServer(assessment);
          showError(error.message || "Diagnosis changes were not saved.");
        }
      }

      function onChange() {
        if (destroyed || !assessment) return;
        if (saveTimer) clearTimeout(saveTimer);
        $("save-state").textContent = "Changes pending";
        $("save-state").className = "save-state saving";
        setBusy(true);
        saveTimer = setTimeout(() => persistAssessment(null), 350);
      }

      function bindHandlers() {
        addListener($("confirm-btn"), "click", () => {
          if (assessment && assessment.evaluation.met) persistAssessment("confirmed");
        });
        addListener($("bypass-btn"), "click", () => {
          if (window.confirm("Record an attributable clinician bypass regardless of the server criteria result?")) {
            persistAssessment("bypass");
          }
        });
      }

      function start() {
        setBusy(true);
        Promise.all([
          criteria.length ? Promise.resolve() : loadMeta(),
          csrfToken ? Promise.resolve() : ensureCsrfToken()
        ])
          .then(loadAssessment)
          .catch(error => {
            if (error.name !== "AbortError" && !destroyed) showError(error.message || "Diagnosis assessment could not be loaded.");
          });
      }

      function mount() {
        if (destroyed || mounted) return;
        mounted = true;
        buildDom();
        bindHandlers();
        start();
      }

      function unmount() {
        destroyed = true;
        if (saveTimer) clearTimeout(saveTimer);
        controller.abort();
        listeners.forEach(({node, type, handler}) => {
          try { node.removeEventListener(type, handler); } catch (_) { /* no-op */ }
        });
        listeners.length = 0;
        root.innerHTML = "";
      }

      function setAssessmentContext(nextContext) {
        if (destroyed) return;
        const normalized = normalizeContext(nextContext);
        if (normalized.patientId !== context.patientId || normalized.encounterId !== context.encounterId) {
          createKey = makeIdempotencyKey();
        }
        context = normalized;
        assessment = null;
        etag = "";
        if (!mounted) return;
        if (saveTimer) clearTimeout(saveTimer);
        controller.abort();
        controller = new AbortController();
        clearError();
        start();
      }

      return { mount, unmount, setAssessmentContext };
    }

    window.createDiagnosisModule = createDiagnosisModule;

    document.addEventListener("DOMContentLoaded", function bootstrapStandalone() {
      if (window.__diagnosisModuleBooted) return;
      window.__diagnosisModuleBooted = true;
      const root = document.getElementById("diagnosis-root") || document.body;
      const instance = createDiagnosisModule({root: root, apiBaseUrl: "", embedded: false});
      instance.mount();
      window.__diagnosisModuleInstance = instance;
    });
  </script>
</body>
</html>
