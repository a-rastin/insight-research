<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INSIGHT PANSS Severity Assessment</title>
  <style>
    :root {
      --primary: #087f74;
      --primary-hover: #06665e;
      --primary-light: #e6f6f5;
      --ink: #111827;
      --ink-muted: #4b5563;
      --canvas: #fff;
      --surface: #f9fafb;
      --border: #d1d5db;
      --urgent: #b91c1c;
      --urgent-bg: #fef2f2;
      --warning: #92400e;
      --warning-bg: #fffbeb;
      --normal: #047857;
      --normal-bg: #ecfdf5;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); }
    button { font: inherit; }
    button, [tabindex] { min-width: 44px; min-height: 44px; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .severity-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .severity-header { min-height: 56px; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .severity-wordmark { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
    .severity-context { color: var(--ink-muted); font-size: 13px; }
    .severity-main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; flex: 1; min-height: 0; }
    .severity-questionnaire { padding: 24px; overflow: auto; }
    .severity-summary { padding: 24px; background: var(--surface); border-left: 1px solid var(--border); }
    .severity-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .severity-tab { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); color: var(--ink); font-weight: 700; }
    .severity-tab[aria-selected="true"] { border-color: var(--primary); background: var(--primary-light); }
    .severity-item { margin: 0; padding: 18px 0; border: 0; border-top: 1px solid var(--border); }
    .severity-item legend { width: 100%; padding: 0; font-weight: 700; }
    .severity-description { margin: 6px 0 12px; color: var(--ink-muted); font-size: 14px; line-height: 1.5; }
    .severity-scores { display: flex; flex-wrap: wrap; gap: 6px; }
    .severity-score { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); color: var(--ink); font-weight: 700; }
    .severity-score[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: #fff; }
    .severity-label { min-height: 20px; margin-top: 8px; color: var(--ink-muted); font-size: 13px; font-weight: 700; }
    .severity-card { padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--canvas); }
    .severity-card + .severity-card { margin-top: 16px; }
    .severity-card h2 { margin: 0 0 12px; font-size: 16px; }
    .severity-status { padding: 12px 14px; border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; line-height: 1.5; }
    .severity-status[data-kind="normal"] { border-left-color: var(--normal); background: var(--normal-bg); }
    .severity-status[data-kind="warning"] { border-left-color: var(--warning); background: var(--warning-bg); }
    .severity-status[data-kind="urgent"] { border-left-color: var(--urgent); background: var(--urgent-bg); }
    .severity-progress { width: 100%; height: 10px; border-radius: 999px; overflow: hidden; background: #e5e7eb; }
    .severity-progress > span { display: block; height: 100%; background: var(--primary); }
    .severity-server-scores { margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .severity-server-scores dt { color: var(--ink-muted); }
    .severity-server-scores dd { margin: 0; font-family: "JetBrains Mono", monospace; font-weight: 700; }
    .severity-actions { display: grid; gap: 10px; margin-top: 16px; }
    .severity-primary, .severity-secondary { padding: 10px 14px; border-radius: 8px; font-weight: 750; }
    .severity-primary { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
    .severity-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .severity-secondary { border: 1px solid var(--border); background: var(--canvas); color: var(--ink); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .severity-help { color: var(--ink-muted); font-size: 13px; line-height: 1.5; }
    .severity-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 800px) {
      .severity-main { grid-template-columns: 1fr; }
      .severity-summary { border-top: 1px solid var(--border); border-left: 0; }
      .severity-questionnaire, .severity-summary { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="severity-root"></div>
  <script type="module">
    import { mount } from "/severity-ui.js";
    mount({
      root: document.getElementById("severity-root"),
      context: window.__INSIGHT_SEVERITY_CONTEXT__ || null
    });
  </script>
</body>
</html>
