worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    access_log off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 1m;
    server_tokens off;

    server {
        listen 8080;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /api/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://127.0.0.1:8101;
            include /etc/nginx/insight-proxy.conf;
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"live","service":"gateway"}';
        }
        location = /readyz { proxy_pass http://127.0.0.1:8099/readyz; }

        location /api/auth/ { proxy_pass http://127.0.0.1:8101; include /etc/nginx/insight-proxy.conf; }
        location /dashboard/ { proxy_pass http://127.0.0.1:8102; include /etc/nginx/insight-proxy.conf; }
        location /internal/dashboard/ { proxy_pass http://127.0.0.1:8102; include /etc/nginx/insight-proxy.conf; }

        location /api/add-new-patient/ { proxy_pass http://127.0.0.1:8103; include /etc/nginx/insight-proxy.conf; }
        location /api/patients { proxy_pass http://127.0.0.1:8103; include /etc/nginx/insight-proxy.conf; }
        location /modules/add-new-patient { proxy_pass http://127.0.0.1:8103; include /etc/nginx/insight-proxy.conf; }

        location /api/diagnosis/ { proxy_pass http://127.0.0.1:8104; include /etc/nginx/insight-proxy.conf; }
        location /diagnosis/ { proxy_pass http://127.0.0.1:8104; include /etc/nginx/insight-proxy.conf; }
        location /internal/diagnosis/ { proxy_pass http://127.0.0.1:8104; include /etc/nginx/insight-proxy.conf; }
        location = /modules/diagnosis { return 308 /modules/diagnosis/; }
        location /modules/diagnosis/ { proxy_pass http://127.0.0.1:8104/; include /etc/nginx/insight-proxy.conf; }

        location /api/severity/ { proxy_pass http://127.0.0.1:8105; include /etc/nginx/insight-proxy.conf; }
        location = /modules/severity { return 308 /modules/severity/; }
        location /modules/severity/ { proxy_pass http://127.0.0.1:8105/; include /etc/nginx/insight-proxy.conf; }

        location /api/medical-history/ { proxy_pass http://127.0.0.1:8106; include /etc/nginx/insight-proxy.conf; }
        location /api/internal/medical-history/ { proxy_pass http://127.0.0.1:8106; include /etc/nginx/insight-proxy.conf; }
        location = /modules/medical-history { return 308 /modules/medical-history/; }
        location /modules/medical-history/ { proxy_pass http://127.0.0.1:8106/; include /etc/nginx/insight-proxy.conf; }

        location /api/ddi/ { proxy_pass http://127.0.0.1:8107; include /etc/nginx/insight-proxy.conf; }
        location = /modules/ddi { return 308 /modules/ddi/; }
        location /modules/ddi/ { proxy_pass http://127.0.0.1:8107/; include /etc/nginx/insight-proxy.conf; }

        location /api/bn-manager/v1 { proxy_pass http://127.0.0.1:8108; include /etc/nginx/insight-proxy.conf; }
        location /modules/bn-manager { proxy_pass http://127.0.0.1:8108; include /etc/nginx/insight-proxy.conf; }

        location /api/suicide-risk/ { proxy_pass http://127.0.0.1:8109; include /etc/nginx/insight-proxy.conf; }
        location = /modules/suicide-risk { return 308 /modules/suicide-risk/; }
        location /modules/suicide-risk/ { proxy_pass http://127.0.0.1:8109/; include /etc/nginx/insight-proxy.conf; }

        location /api/treatment-plan/ { proxy_pass http://127.0.0.1:8110; include /etc/nginx/insight-proxy.conf; }
        location /modules/treatment-plan { proxy_pass http://127.0.0.1:8110; include /etc/nginx/insight-proxy.conf; }
        location /assets/ { proxy_pass http://127.0.0.1:8110; include /etc/nginx/insight-proxy.conf; }

        location / { proxy_pass http://127.0.0.1:8101; include /etc/nginx/insight-proxy.conf; }
    }
}
