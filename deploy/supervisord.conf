[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:authentication]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8101 --timeout-graceful-shutdown 30
directory=/opt/insight/Modules/Auth
environment=AUTH_DB_PATH="/var/lib/insight/authentication/auth.db"
priority=10
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dashboard]
command=/opt/venv/bin/uvicorn dashboard_backend.main:app --host 127.0.0.1 --port 8102 --timeout-graceful-shutdown 30
directory=/opt/insight/Modules/Dashboard-1.2.0
environment=DASHBOARD_DB_PATH="/var/lib/insight/dashboard/dashboard.db",AUTH_SESSION_URL="http://127.0.0.1:8101/api/auth/v2/session",DASHBOARD_MOCK_AUTH="0",DDI_READINESS_URL="http://127.0.0.1:8107/readyz",BN_MANAGER_READINESS_URL="http://127.0.0.1:8108/api/ready",BN_MANAGER_STATUS_URL="http://127.0.0.1:8108/api/bn-manager/v3/models"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:add-new-patient]
command=/opt/venv/bin/uvicorn add_new_patient_backend.main:app --host 127.0.0.1 --port 8103 --timeout-graceful-shutdown 30
directory=/opt/insight/Modules/Add-New-Patient-1.1.0
environment=ADD_NEW_PATIENT_DB_PATH="/var/lib/insight/add-new-patient/patients.db",AUTH_SESSION_URL="http://127.0.0.1:8101/api/auth/v2/session",ADD_NEW_PATIENT_MOCK_AUTH="0"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:diagnosis]
command=/opt/venv/bin/uvicorn diagnosis.app:app --host 127.0.0.1 --port 8104 --timeout-graceful-shutdown 30
directory=/opt/insight/Modules/Diagnosis-1.2.0
environment=DIAGNOSIS_DB_PATH="/var/lib/insight/diagnosis/diagnosis.db",AUTH_BASE_URL="http://127.0.0.1:8101",PATIENT_BASE_URL="http://127.0.0.1:8103",DIAGNOSIS_PATIENT_LOOKUP="1",DIAGNOSIS_AUTH_BYPASS="0"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:severity]
command=/usr/local/bin/node server.js
directory=/opt/insight/Modules/Severity-1.1.0
environment=PORT="8105",SEVERITY_DB_PATH="/var/lib/insight/severity/severity.db",SEVERITY_AUTH_BASE_URL="http://127.0.0.1:8101"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:medical-history]
command=/usr/local/bin/node server.js
directory=/opt/insight/Modules/Medical-History-1.0.0
environment=PORT="8106",MEDICAL_HISTORY_DATA_DIR="/var/lib/insight/medical-history",MEDICAL_HISTORY_DB_PATH="/var/lib/insight/medical-history/medical-history.db",MEDICAL_HISTORY_AUTH_BASE_URL="http://127.0.0.1:8101"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ddi-checker]
command=/usr/local/bin/node /opt/insight/deploy/ddi-static-server.mjs
directory=/opt/insight/Modules/DDI-Checker-1.2.0
environment=PORT="8107",DDI_ROOT="/opt/insight/Modules/DDI-Checker-1.2.0",DDI_REGISTRY_ROOT="/var/lib/insight/ddi-checker/registry",DDI_AUTH_SESSION_URL="http://127.0.0.1:8101/api/auth/v2/session",DDI_CALLER_SERVICE_ID="treatment-plan",DDI_SERVICE_AUTH_KEY_ID="tp-ddi-v1",DDI_SERVICE_AUTH_SECRET="%(ENV_DDI_SERVICE_AUTH_SECRET)s"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bn-manager]
command=/opt/venv/bin/python -m bn_manager_backend.server
directory=/opt/insight/Modules/BN-Manager-v.1.1.0/BN-Manager-v.1.1.0
environment=BN_MANAGER_HOST="127.0.0.1",BN_MANAGER_PORT="8108",BN_MANAGER_AUTH_SESSION_URL="http://127.0.0.1:8101/api/auth/v2/session",BN_REGISTRY_ROOT="/var/lib/insight/bn-manager/registry"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:suicide-risk]
command=/usr/local/bin/node server.js
directory=/opt/insight/Modules/Suicide-Risk-1.0.0
environment=PORT="8109",SUICIDE_RISK_DATA_DIR="/var/lib/insight/suicide-risk",SUICIDE_RISK_DB_PATH="/var/lib/insight/suicide-risk/suicide-risk.db",SUICIDE_RISK_AUTH_BASE_URL="http://127.0.0.1:8101"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:treatment-plan]
command=/opt/venv/bin/python -m treatment_plan.deployment serve
directory=/opt/insight/Modules/Treatment-Plan
environment=TP_DATABASE_PATH="/var/lib/insight/treatment-plan/treatment-plan.db",TP_HOST="127.0.0.1",TP_PORT="8110",TP_GRACEFUL_SHUTDOWN_SECONDS="30",TP_AUTHENTICATION_SESSION_URL="http://127.0.0.1:8101/api/auth/v2/session",TP_DDI_BASE_URL="http://127.0.0.1:8107",TP_DDI_SERVICE_AUTH_KEY_ID="tp-ddi-v1",TP_DDI_SERVICE_AUTH_SECRET="%(ENV_DDI_SERVICE_AUTH_SECRET)s",TP_TRUSTED_INTERNAL_ORIGINS="http://127.0.0.1:8101,http://127.0.0.1:8107",TP_AUTH_STUB_ENABLED="false"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:readiness]
command=/opt/venv/bin/python /opt/insight/deploy/readiness.py
directory=/opt/insight
priority=30
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:failfast]
command=/opt/venv/bin/python /opt/insight/deploy/supervisor-failfast.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=100
priority=1
