# Unified local run. Secrets default to fixed local-dev values so the whole app
# starts with a single command (`docker compose up --build`). Override any of
# them via the shell environment or a `.env` file in the repo root (compose loads
# it automatically). The production path stays strict: compose.release.yaml.
services:
  insight:
    build:
      context: ..
      dockerfile: Dockerfile
    image: insight-unified:local
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      TP_ENV: production
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-jwt-secret-do-not-use-in-prod}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      ADD_NEW_PATIENT_CSRF_SECRET: ${ADD_NEW_PATIENT_CSRF_SECRET:-local-dev-csrf-secret-32chars-min-addnewpatient}
      ADD_NEW_PATIENT_CSRF_SECURE: ${ADD_NEW_PATIENT_CSRF_SECURE:-false}
      DIAGNOSIS_CSRF_SECRET: ${DIAGNOSIS_CSRF_SECRET:-local-dev-csrf-secret-32chars-min-diagnosis}
      DIAGNOSIS_CSRF_SECURE: ${DIAGNOSIS_CSRF_SECURE:-false}
      SEVERITY_CSRF_SECRET: ${SEVERITY_CSRF_SECRET:-local-dev-csrf-secret-32chars-min-severity}
      MEDICAL_HISTORY_CSRF_SECRET: ${MEDICAL_HISTORY_CSRF_SECRET:-local-dev-csrf-secret-32chars-min-medhistory}
      DDI_SERVICE_AUTH_SECRET: ${DDI_SERVICE_AUTH_SECRET:-local-dev-ddi-service-auth-secret-32chars}
      SUICIDE_RISK_CSRF_SECRET: ${SUICIDE_RISK_CSRF_SECRET:-local-dev-csrf-secret-32chars-min-suiciderisk}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - authentication-data:/var/lib/insight/authentication
      - dashboard-data:/var/lib/insight/dashboard
      - add-new-patient-data:/var/lib/insight/add-new-patient
      - diagnosis-data:/var/lib/insight/diagnosis
      - severity-data:/var/lib/insight/severity
      - medical-history-data:/var/lib/insight/medical-history
      - ddi-checker-data:/var/lib/insight/ddi-checker
      - bn-manager-data:/var/lib/insight/bn-manager
      - suicide-risk-data:/var/lib/insight/suicide-risk
      - treatment-plan-data:/var/lib/insight/treatment-plan

volumes:
  authentication-data:
  dashboard-data:
  add-new-patient-data:
  diagnosis-data:
  severity-data:
  medical-history-data:
  ddi-checker-data:
  bn-manager-data:
  suicide-risk-data:
  treatment-plan-data:
